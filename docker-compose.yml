networks:
  cryptopulse:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: cryptopulse-kafka
    networks:
      - cryptopulse
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=cryptopulse-kraft-cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: cryptopulse-postgres
    networks:
      - cryptopulse
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cryptopulse
      - POSTGRES_USER=cryptopulse
      - POSTGRES_PASSWORD=cryptopulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptopulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job that applies the canonical warehouse migrations after the
  # database is healthy. Exits 0 when the schema is up to date.
  postgres-migrations:
    image: python:3.11-slim
    container_name: cryptopulse-postgres-migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cryptopulse
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=cryptopulse
      - POSTGRES_USERNAME=cryptopulse
      - POSTGRES_PASSWORD=cryptopulse
    volumes:
      - ./warehouse:/app/warehouse:ro
      - ./common:/app/common:ro
    working_dir: /app
    command: >
      sh -c "pip install --quiet asyncpg pydantic pydantic-settings structlog &&
             python -m warehouse.migrations"
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cryptopulse-prometheus
    networks:
      - cryptopulse
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.0.0
    container_name: cryptopulse-grafana
    networks:
      - cryptopulse
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
